# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  - "*"

pool:
  vmImage: "ubuntu-latest"
  demands:
    - npm

variables:
  buildConfiguration: "Release"

steps:
  - task: NodeTool@0
    displayName: "Use Node.js"
    inputs:
      versionSpec: '24.x'

  - task: Npm@1
    displayName: "Run npm install"
    inputs:
      command: 'custom'
      customCommand: 'ci'
      verbose: false

  - script: npm test
    displayName: "Run frontend tests"

  - script: npm run build
    displayName: "Build React application"

  - script: 'echo "$(Build.DefinitionName), $(Build.BuildId), $(Build.BuildNumber)" > build/buildinfo.txt'
    displayName: "Write build info"

  - script: |
      mkdir -p TodoApi/wwwroot
      cp -a build/. TodoApi/wwwroot/
    displayName: "Include React build in .NET app"

  - task: UseDotNet@2
    displayName: "Use .NET SDK 10"
    inputs:
      packageType: "sdk"
      version: "10.x"

  - task: DotNetCoreCLI@2
    displayName: "Restore project dependencies"
    inputs:
      command: "restore"
      projects: "**/*.csproj"

  - task: DotNetCoreCLI@2
    displayName: "Run .NET API tests"
    inputs:
      command: "test"
      projects: "TodoApi.Tests/TodoApi.Tests.csproj"
      arguments: "--configuration $(buildConfiguration) --no-restore"
      publishTestResults: true

  - template: templates/build.yml
    parameters:
      buildConfiguration: 'Debug'

  - template: templates/build.yml
    parameters:
      buildConfiguration: 'Release'

  - task: AzureAppServiceSettings@1
    displayName: "Configure App Service settings"
    inputs:
      azureSubscription: "AzureRM-todo-rg-todo-dev"
      appName: "todo"
      resourceGroupName: "rg-todo-dev"
      appSettings: |
        [
          {"name":"ConnectionStrings__TodoDatabase","value":"Server=tcp:todos.database.windows.net,1433;Initial Catalog=todos-db-free;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Managed Identity","slotSetting":false},
          {"name":"Auth0__Domain","value":"dev-c8e8wu8m.auth0.com","slotSetting":false},
          {"name":"Auth0__Audience","value":"todoapi","slotSetting":false}
        ]

  - task: AzureWebApp@1
    displayName: "Deploy React and .NET app to Azure App Service"
    inputs:
      azureSubscription: "AzureRM-todo-rg-todo-dev"
      appType: "webAppLinux"
      appName: "todo"
      package: "$(Build.ArtifactStagingDirectory)/Release/*.zip"
      runtimeStack: "DOTNETCORE|10.0"

  - task: PublishBuildArtifacts@1
    displayName: "Publish Artifact: drop"
    condition: succeeded()
